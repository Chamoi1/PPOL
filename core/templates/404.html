{% extends "base.html" %}
{% block title %}Página no encontrada · PPOL{% endblock %}
{% block content %}
<div class="empty-state" style="padding:60px 24px;max-width:540px;margin:40px auto;">
  <div style="font-size:64px;font-weight:800;color:var(--ink);line-height:1;margin-bottom:12px;letter-spacing:-0.03em;">404</div>
  <h2 style="margin:0 0 8px;font-size:20px;font-weight:700;">Página no encontrada</h2>
  <p style="color:var(--muted);font-size:14px;margin-bottom:24px;">
    La sección o convocatoria a la que intentas acceder no existe, ha sido eliminada o ya no está disponible.
  </p>
  <a class="btn" href="{% url 'home' %}">
    <i class="bi bi-house me-1"></i> Volver al inicio
  </a>
</div>
{% endblock %}
