{% extends "base.html" %}
{% block title %}Página no encontrada · PPOL{% endblock %}
{% block content %}
<div class="empty-state" style="padding:60px 24px;max-width:600px;margin:40px auto;">
  <div style="font-size:72px;font-weight:800;color:var(--brand);line-height:1;margin-bottom:12px;">404</div>
  <h2 style="margin:0 0 10px;font-size:24px;">Página no encontrada</h2>
  <p style="color:var(--muted);font-size:15px;margin-bottom:24px;">
    La sección o convocatoria a la que intentas acceder no existe, ha sido trasladada o ya no está disponible.
  </p>
  <a class="btn lg" href="{% url 'home' %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Volver al inicio de PPOL
  </a>
</div>
{% endblock %}
